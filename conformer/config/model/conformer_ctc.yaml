# @package _global_
module:
  _target_: emg2qwerty.conformer.ConformerModule
  in_features: 528  # freq * channels = (n_fft // 2 + 1) * 16
  mlp_features: [384]
  block_channels: [24, 24, 24, 24]  # unused by Conformer; kept for signature parity
  kernel_width: 31  # depthwise conv requires odd kernel ('same' padding)

datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  window_length: 8000  # 4 sec windows for 2kHz EMG
  padding: [1800, 200]  # 900ms past context, 100ms future context
