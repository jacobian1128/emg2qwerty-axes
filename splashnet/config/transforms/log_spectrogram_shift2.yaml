# @package _global_
# 증강 2라운드(A3aug2): 시프트+지터 + 리샘플 워프(전도속도/템포) + 크기 워프(접촉 드리프트)
# (정수 회전 ±1은 FractionalBandRotation(max 1.5)이 포함하므로 대체)
to_tensor:
  _target_: emg2qwerty.transforms.ToTensor
  fields: [emg_left, emg_right]

frac_rotation:
  _target_: emg2qwerty.transforms.ForEach  # 밴드별 i.i.d.
  transform:
    _target_: emg2qwerty.transforms.FractionalBandRotation
    max_offset: 1.5

resample_warp:
  _target_: emg2qwerty.transforms.RandomResampleWarp
  max_factor: 0.1

magnitude_warp:
  _target_: emg2qwerty.transforms.MagnitudeWarp
  sigma: 0.2
  knots: 4

gain_jitter:
  _target_: emg2qwerty.transforms.ForEach  # 밴드별 i.i.d.
  transform:
    _target_: emg2qwerty.transforms.PerChannelGainJitter
    sigma: 0.2

temporal_jitter:
  _target_: emg2qwerty.transforms.TemporalAlignmentJitter
  max_offset: 120

logspec:
  _target_: emg2qwerty.transforms.NewLogSpectrogram
  n_fft: 64
  hop_length: 16

specaug:
  _target_: emg2qwerty.transforms.SpecAugment
  n_time_masks: 0  # ACM
  time_mask_param: 25
  n_freq_masks: 2
  freq_mask_param: 12  # ACM

transforms:
  train:
    - ${to_tensor}
    - ${resample_warp}
    - ${magnitude_warp}
    - ${frac_rotation}
    - ${gain_jitter}
    - ${temporal_jitter}
    - ${logspec}
    - ${specaug}

  val:
    - ${to_tensor}
    - ${logspec}

  test: ${transforms.val}
