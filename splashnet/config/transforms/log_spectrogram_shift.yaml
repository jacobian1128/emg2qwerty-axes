# @package _global_
# 증강 라이더: 기존 레시피 + 소수점 전극 시프트 + 채널 게인 지터
# (정수 회전 ±1은 FractionalBandRotation(max 1.5)이 포함하므로 대체)
to_tensor:
  _target_: emg2qwerty.transforms.ToTensor
  fields: [emg_left, emg_right]

frac_rotation:
  _target_: emg2qwerty.transforms.ForEach  # 밴드별 i.i.d.
  transform:
    _target_: emg2qwerty.transforms.FractionalBandRotation
    max_offset: 1.5

gain_jitter:
  _target_: emg2qwerty.transforms.ForEach  # 밴드별 i.i.d.
  transform:
    _target_: emg2qwerty.transforms.PerChannelGainJitter
    sigma: 0.2

temporal_jitter:
  _target_: emg2qwerty.transforms.TemporalAlignmentJitter
  max_offset: 120

logspec:
  _target_: emg2qwerty.transforms.NewLogSpectrogram
  n_fft: 64
  hop_length: 16

specaug:
  _target_: emg2qwerty.transforms.SpecAugment
  n_time_masks: 0  # ACM
  time_mask_param: 25
  n_freq_masks: 2
  freq_mask_param: 12  # ACM

transforms:
  train:
    - ${to_tensor}
    - ${frac_rotation}
    - ${gain_jitter}
    - ${temporal_jitter}
    - ${logspec}
    - ${specaug}

  val:
    - ${to_tensor}
    - ${logspec}

  test: ${transforms.val}
