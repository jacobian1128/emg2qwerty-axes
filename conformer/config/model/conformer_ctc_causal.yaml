# @package _global_
# Causal Conformer (reviewer #4 control): same recipe as conformer_ctc, but
# attention/conv see only past frames and the window carries no future padding.
module:
  _target_: emg2qwerty.conformer.CausalConformerModule
  in_features: 528
  mlp_features: [384]
  block_channels: [24, 24, 24, 24]
  kernel_width: 31

datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  window_length: 8000
  padding: [1800, 0]  # 900ms past context, no future context (causal)
